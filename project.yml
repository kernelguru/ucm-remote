name: UCMRemote
options:
  bundleIdPrefix: de.marck
  deploymentTarget:
    iOS: "16.0"
targets:
  UCMRemote:
    type: application
    platform: iOS
    sources:
      - UCMRemote
    scheme: {}
    info:
      path: UCMRemote/Info.plist
      properties:
        CFBundleDisplayName: UCM Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        NSLocalNetworkUsageDescription: Die App verbindet sich mit deinem Ultimate CA Manager im lokalen Netzwerk.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.marck.ucmremote
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
